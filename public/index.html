<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Opportunity Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">

  <h1 class="mb-4">Research Opportunity Portal</h1>

  <!-- success and error messages appear here -->
  <div id="message"></div>

  <!-- FORM: used for both creating and editing -->
  <div class="card mb-4">
    <div class="card-body">
      <h4 id="formTitle">Add New Opportunity</h4>
      <form id="opportunityForm">
        <input type="hidden" id="editId">

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Title</label>
            <input type="text" id="title" class="form-control">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Research Area</label>
            <input type="text" id="research_area" class="form-control">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea id="description" class="form-control" rows="2"></textarea>
        </div>

        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label">Faculty Member</label>
            <input type="text" id="faculty_name" class="form-control">
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Department</label>
            <input type="text" id="department" class="form-control">
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Required Skills</label>
            <input type="text" id="required_skills" class="form-control">
          </div>
        </div>

        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label">Available Positions</label>
            <input type="number" id="positions" class="form-control" min="1">
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label">Application Deadline</label>
            <input type="date" id="deadline" class="form-control">
          </div>
          <div class="col-md-4 mb-3" id="statusGroup" style="display:none;">
            <label class="form-label">Status</label>
            <select id="status" class="form-select">
              <option value="Open">Open</option>
              <option value="Closed">Closed</option>
            </select>
          </div>
        </div>

        <button type="submit" id="saveButton" class="btn btn-primary">Save</button>
        <button type="button" id="cancelButton" class="btn btn-secondary" style="display:none;">Cancel Edit</button>
      </form>
    </div>
  </div>

  <!-- DETAILS of one selected opportunity -->
  <div id="details"></div>

  <!-- LIST of all opportunities -->
  <h4>All Opportunities</h4>
  <table class="table table-bordered bg-white">
    <thead>
      <tr>
        <th>ID</th><th>Title</th><th>Area</th><th>Faculty</th>
        <th>Positions</th><th>Deadline</th><th>Status</th><th>Actions</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

</div>
<script src="script.js"></script>
</body>
</html>
