<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Research Opportunity Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- top bar -->
  <header class="topbar">
    <button id="menuButton" class="icon-button" aria-label="Open menu">☰</button>
    <h1>Research Opportunity Portal</h1>
  </header>

  <!-- dark background behind the menu -->
  <div id="overlay" class="overlay"></div>

  <!-- sliding side menu -->
  <nav id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <span>Menu</span>
      <button id="closeMenuButton" class="icon-button" aria-label="Close menu">✕</button>
    </div>
    <button class="menu-item" id="menuAll" onclick="showList('all')">
      <span>📋 All Opportunities</span><span class="count" id="countAll">0</span>
    </button>
    <button class="menu-item" id="menuOpen" onclick="showList('Open')">
      <span>🟢 Open</span><span class="count" id="countOpen">0</span>
    </button>
    <button class="menu-item" id="menuClosed" onclick="showList('Closed')">
      <span>🔒 Closed</span><span class="count" id="countClosed">0</span>
    </button>
    <button class="menu-item" id="menuAdd" onclick="openAddForm()">
      <span>➕ Add New Opportunity</span>
    </button>
  </nav>

  <main class="content">

    <!-- LIST VIEW -->
    <section id="listView">
      <div class="stats">
        <div class="stat"><div class="stat-number" id="statTotal">0</div><div class="stat-label">Total</div></div>
        <div class="stat"><div class="stat-number green" id="statOpen">0</div><div class="stat-label">Open</div></div>
        <div class="stat"><div class="stat-number grey" id="statClosed">0</div><div class="stat-label">Closed</div></div>
      </div>

      <h2 id="listTitle">All Opportunities</h2>
      <div id="cards" class="cards"></div>
    </section>

    <!-- FORM VIEW (used for adding and editing) -->
    <section id="formView" class="hidden">
      <div class="panel">
        <h2 id="formTitle">Add New Opportunity</h2>

        <form id="opportunityForm" novalidate>
          <input type="hidden" id="editId">

          <div class="grid">
            <div class="field">
              <label for="title">Title *</label>
              <input type="text" id="title" placeholder="e.g. AI for Healthcare">
            </div>
            <div class="field">
              <label for="research_area">Research Area *</label>
              <input type="text" id="research_area" placeholder="e.g. Machine Learning">
            </div>

            <div class="field full">
              <label for="description">Description *</label>
              <textarea id="description" rows="3" placeholder="What is this research about?"></textarea>
            </div>

            <div class="field">
              <label for="faculty_name">Faculty Member *</label>
              <input type="text" id="faculty_name" placeholder="e.g. Dr. Ahmed">
            </div>
            <div class="field">
              <label for="department">Department *</label>
              <input type="text" id="department" placeholder="e.g. Computer Science">
            </div>

            <div class="field full">
              <label for="required_skills">Required Skills *</label>
              <input type="text" id="required_skills" placeholder="e.g. Python, Statistics">
            </div>

            <div class="field">
              <label for="positions">Available Positions *</label>
              <input type="number" id="positions" min="1" placeholder="e.g. 2">
            </div>
            <div class="field">
              <label for="deadline">Application Deadline *</label>
              <input type="date" id="deadline">
            </div>

            <div class="field" id="statusGroup">
              <label for="status">Status</label>
              <select id="status">
                <option value="Open">Open</option>
                <option value="Closed">Closed</option>
              </select>
            </div>
          </div>

          <div class="form-buttons">
            <button type="submit" class="btn primary">Save</button>
            <button type="button" class="btn ghost" onclick="showList(currentFilter)">Cancel</button>
          </div>
        </form>
      </div>
    </section>

  </main>

  <!-- DETAILS WINDOW -->
  <div id="detailsModal" class="modal hidden">
    <div class="modal-box">
      <button class="modal-close" onclick="closeDetails()" aria-label="Close">✕</button>
      <div id="detailsBody"></div>
    </div>
  </div>

  <!-- POPUP MESSAGES (bottom-right) -->
  <div id="toastBox" class="toast-box"></div>

  <script src="script.js"></script>
</body>
</html>
